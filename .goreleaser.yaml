# goreleaser v2 config — build the standalone client and server binaries.
# Local dry run:  goreleaser release --snapshot --clean
version: 2

project_name: tonnet-messenger

builds:
  - id: client
    main: ./cmd/tonnet-messenger
    binary: tonnet-messenger
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TONresistor/tonnet-messenger/internal/clientcli.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
  - id: server
    main: ./cmd/tonnet-messenger-server
    binary: tonnet-messenger-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TONresistor/tonnet-messenger/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: client
    builds: [client]
    formats: [tar.gz]
    name_template: "tonnet-messenger_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
  - id: server
    builds: [server]
    formats: [tar.gz]
    name_template: "tonnet-messenger-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
